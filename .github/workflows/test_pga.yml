name: Test PGA Tour API

on:
  workflow_dispatch:

jobs:
  test-pga:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pgatourPY
        run: pip install git+https://github.com/WalrusQuant/pgatourPY.git

      - name: Test PGA leaderboard
        run: |
          python - <<'PY'
          import pgatourpy as pga

          print("Testing PGA Tour API...")

          data = pga.pga_leaderboard("R2026475")

          print(data.to_string())
          print("\nSUCCESS - PGA Tour data was retrieved!")
          PY
