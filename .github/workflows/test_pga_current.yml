name: Test Current PGA Tournament

on:
  workflow_dispatch:

jobs:
  test-pga:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pgatourPY
        run: pip install git+https://github.com/WalrusQuant/pgatourPY.git

      - name: Find current PGA tournament
        run: |
          python - <<'PY'
          import pgatourpy as pga
          from datetime import datetime

          print("Getting PGA schedule...")

          schedule = pga.pga_schedule()

          print("\nLooking for current tournament...")

          today = datetime.now().date()

          for _, row in schedule.iterrows():
              print(
                  row["tournament_id"],
                  "|",
                  row["tournament_name"],
                  "|",
                  row["display_date"],
                  "|",
                  row["status"]
              )

          print("\nSchedule retrieved successfully!")
          print("Number of tournaments:", len(schedule))
          PY
