name: Test PGA Data Generator

on:
  workflow_dispatch:

jobs:
  test-pga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pgatourPY
        run: pip install git+https://github.com/WalrusQuant/pgatourPY.git

      - name: Generate PGA data
        run: python scripts/update_pga.py

      - name: Show generated JSON
        run: cat site/pga.json
