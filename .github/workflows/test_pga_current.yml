name: Test Current PGA Leaderboard

on:
  workflow_dispatch:

jobs:
  test-pga:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pgatourPY
        run: pip install git+https://github.com/WalrusQuant/pgatourPY.git

      - name: Find current tournament and leaderboard
        run: |
          python - <<'PY'
          import pgatourpy as pga

          print("Getting PGA schedule...")

          schedule = pga.pga_schedule()

          current = schedule[
              schedule["status"].str.upper() == "IN_PROGRESS"
          ]

          if current.empty:
              print("No PGA tournament is currently in progress.")
              raise SystemExit(0)

          tournament = current.iloc[0]

          tournament_id = tournament["tournament_id"]
          tournament_name = tournament["tournament_name"]

          print(f"\nCurrent tournament: {tournament_name}")
          print(f"Tournament ID: {tournament_id}")

          print("\nGetting leaderboard...")

          leaderboard = pga.pga_leaderboard(tournament_id)

          print("\nLEADERBOARD:")
          print(leaderboard.to_string(index=False))

          print("\nSUCCESS - Current PGA leaderboard retrieved!")
          PY
